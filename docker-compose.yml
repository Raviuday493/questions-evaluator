services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qpi_postgres
    environment:
      POSTGRES_USER: qpi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: qpi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qpi -d qpi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qpi_redis
    ports:
      - "6379:6379"

  minio:
    image: elestio/minio
    container_name: qpi_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
