# Render Blueprint: free-tier backend + Postgres. The frontend is deployed separately (Vercel).
services:
  - type: web
    name: qpi-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qpi-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: hashing          # 512 MB RAM cannot hold PyTorch + all-mpnet-base-v2
      - key: STORAGE_TYPE
        value: database         # free instances have no persistent disk
      - key: TASK_QUEUE
        value: background

databases:
  - name: qpi-db
    plan: free
    region: singapore
    databaseName: qpi_db
